# ============================================================
# MT7922 5GHz 热点 (Wi-Fi 6E AP)
# 目标客户端: Surface Pro 6 (88W8897, Wi-Fi 5 / 802.11ac)
# 信道 165 = 5825MHz, 20MHz 单信道 (ch165 无法开 80MHz)
# 实测: HT20 + VHT 下 90~120 Mbps
# ============================================================

# 监听接口: 内核创建的 wlan 接口名
interface=wlan_mt7922

# hostapd 驱动类型 (mac80211 通用, 不要动)
driver=nl80211

# 热点名称
ssid=janus_mt7922

# 5GHz 频段 (a = 5GHz, 不要动)
hw_mode=a

# 国家码 + 802.11d 规则 (CN = 中国, 允许 ch149-165; 注释掉则用世界域, 高段信道受限)
country_code=CN
ieee80211d=1

# 主信道: 165 (5825MHz)
# 149 = 5745MHz (备用, 但 149 周围邻居多, 165 更干净)
channel=165
#channel=149

# ============ WIFI 4 (802.11n / HT) ============
# HT 是底座: 所有 5GHz 客户端都靠它拿 MIMO/聚合
ieee80211n=1
# HT 能力: ch165 只能 20MHz, 不能请求 HT40 (HT40+ 会超 5835 上限, hostapd 拒绝)
# 想开 40MHz 要用 ch149 + [HT40+][SHORT-GI-20][SHORT-GI-40]
#ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]
ht_capab=[SHORT-GI-20]

# ============ WIFI 5 (802.11ac / VHT) ============
# VHT: Surface 实际走的路, 256-QAM / 80MHz 能力
ieee80211ac=1
# VHT 带宽: 0 = 20MHz (ch165 只能 20MHz)
vht_oper_chwidth=0
# 80MHz 中心索引: 155 = 5775MHz (配 ch149 才有效, ch165 无效)
#vht_oper_chwidth=1
#vht_oper_centr_freq_seg0_idx=155
# vht_oper_cch_wide80_center_idx=155
#vht_capab=[SHORT-GI-80][RXLDPC][TX-STBC-2BY1]

# ============ WIFI 6 (802.11ax / HE) ============
# HE: 只有 Wi-Fi 6 客户端用得到, Surface 是 Wi-Fi 5, 这行对它是摆设
ieee80211ax=1
# HE 带宽: 0 = 20MHz
he_oper_chwidth=0
# 80MHz 中心索引 (配 ch149 才有效)
#he_oper_chwidth=1
#he_oper_centr_freq_seg0_idx=155

# ============ 安全 ============
# WPA2 认证
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
# 热点密码
wpa_passphrase=27149000

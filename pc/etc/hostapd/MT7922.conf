interface=wlan_mt7922
driver=nl80211
ssid=janus_mt7922
hw_mode=a

# 80MHz 中心 ch155 / 5775MHz
channel=149

# WIFI 4
ieee80211n=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]

# WIFI 5
ieee80211ac=1
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=155
# vht_oper_cch_wide80_center_idx=155
vht_capab=[SHORT-GI-80][RXLDPC][TX-STBC-2BY1]

# WIFI 6
ieee80211ax=1
he_oper_chwidth=1
he_oper_centr_freq_seg0_idx=155

wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=27149000

  enable: true
  ipv6: true
  enhanced-mode: redir-host
  nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query

proxies:
  - name: bytevirt
    type: hysteria2
    server: "69.8.136.33"
    port: 443
    password: "27149"
    skip-cert-verify: true

rules:

mode: rule
ipv6: true
unified-delay: true
allow-lan: true

tun:
  enable: true
  auto-route: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: redir-host
  nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query

proxies:
  - name: bytevirt
    type: hysteria2
    server: "2a01:4f8:162:54d9:1c1::"
    port: 443
    password: "27149"
    skip-cert-verify: true

rules:
  - GEOIP,CN,DIRECT
  - MATCH,bytevirt

